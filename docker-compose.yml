version: '3.8'

services:
  app:
    build: .
    container_name: canadian-iptv-player
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - IPTV_ORG_REPO=iptv-org/iptv
      - DB_PATH=/app/data/epg.db
      - LOG_LEVEL=info
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  data:
  logs:
